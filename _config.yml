title: Family Recipe Book
repository: bghngao/recipe-book
# GitHub project Pages serves this site under /recipe-book.
baseurl: "/recipe-book"

collections:
  recipes:
    output: true
    permalink: /recipes/:name/

exclude:
  - Gemfile
  - Gemfile.lock
  - README.md
  - package.json
  - tests
  - scripts
  - vendor
